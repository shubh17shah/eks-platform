# Self-signed issuer: this sandbox has no delegated public domain to run an
# ACME HTTP01/DNS01 challenge against, so cert-manager issues off a locally
# generated CA instead of Let's Encrypt. Browsers will flag the cert as
# untrusted, but every other piece of the "cert-manager TLS" story is real
# and identical to production: the Ingress annotation in
# charts/values/svc-01.yaml triggers cert-manager to create a Certificate,
# which it turns into the api-gateway-tls Secret the Ingress references,
# and it renews that Secret automatically before expiry.
#
# To go live with a real domain, add a second ClusterIssuer here of the
# shape below (ACME + DNS01 via Route53, so it doesn't depend on the ALB
# being reachable yet during the challenge) and switch the
# cert-manager.io/cluster-issuer annotation on the Ingress to point at it:
#
#   apiVersion: cert-manager.io/v1
#   kind: ClusterIssuer
#   metadata:
#     name: letsencrypt-prod
#   spec:
#     acme:
#       server: https://acme-v02.api.letsencrypt.org/directory
#       email: platform@example.com
#       privateKeySecretRef:
#         name: letsencrypt-prod-key
#       solvers:
#         - dns01:
#             route53:
#               region: ap-south-1
#           selector:
#             dnsZones:
#               - "example.com"
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-cluster-issuer
spec:
  selfSigned: {}
