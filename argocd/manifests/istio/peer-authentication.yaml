# Mesh-wide mTLS for the "apps" namespace: every meshed pod (currently
# api-gateway and payment-service — see the istio-injection note in
# argocd/manifests/namespaces) must present a mutual TLS cert to talk to
# another meshed pod. Istio issues and rotates these certs itself via
# istiod, so this is one line for a real, auto-rotating in-mesh mTLS
# guarantee. Requires istiod's CRDs, hence the later sync-wave.
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: apps
spec:
  mtls:
    mode: STRICT
