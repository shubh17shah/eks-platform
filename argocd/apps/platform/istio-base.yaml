# Sync-wave 0. Installs Istio's CRDs (VirtualService, DestinationRule,
# PeerAuthentication, ...) and cluster-scoped resources only — no
# workloads. istiod (wave 1) depends on these CRDs existing first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    # Pin deliberately rather than float "*" — bump with
    # `helm repo update && helm search repo istio/base --versions`.
    targetRevision: 1.23.2
    helm:
      values: |
        defaultRevision: default
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
