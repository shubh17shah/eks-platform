# inventory-service — one Helm release of the shared charts/microservice chart,
# parameterized by charts/values/svc-10.yaml. Sync-wave 10 so every platform
# component (namespaces, cert-manager, the ALB controller, metrics-server,
# istiod, kube-prometheus-stack) is already healthy before this deploys —
# the chart's ServiceMonitor/VirtualService/Ingress all depend on CRDs
# those install.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inventory-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/shubh17shah/eks-platform.git
    targetRevision: main
    path: charts/microservice
    helm:
      valueFiles:
        - ../values/svc-10.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
