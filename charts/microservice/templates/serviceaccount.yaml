{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "microservice.serviceAccountName" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No IRSA role annotation by default — these are plain in-cluster HTTP
# services with no AWS API calls to make. A service that needs one (e.g. to
# read from S3 or DynamoDB) adds eks.amazonaws.com/role-arn via
# serviceAccount.annotations in its own charts/values/svc-XX.yaml.
{{- end }}
