# Default values for the generic `microservice` chart.
#
# These defaults are deliberately conservative — everything is OFF unless a
# per-service file in charts/values/ turns it on — because this chart backs
# 12 concurrent releases on a 2x t3.small node group (~4GB RAM total, most
# of it already spoken for by the platform: ArgoCD, kube-prometheus-stack,
# istiod, cert-manager, the ALB controller). Ingress, HPA and the Istio
# sidecar are opt-in per service for exactly that reason.

nameOverride: ""
fullnameOverride: ""

image:
  # All 12 services share this one image, built and published by the
  # sibling application repo (github.com/shubh17shah/devsecops-pipeline) —
  # only the SERVICE_NAME env var and a handful of *_ENABLED flags
  # (Postgres/Redis/RabbitMQ) differ between them. See apps/README.md for
  # why application source lives in that repo and not this one.
  repository: ghcr.io/shubh17shah/telemetry-service
  # CI in devsecops-pipeline builds, scans, signs and publishes a new image
  # to the repository above, then commits/PRs a bump of THIS field back
  # into this repo. ArgoCD watches this repo and syncs the change into the
  # cluster — this field is the entire deploy boundary between "CI has a
  # new image" and "the cluster runs it." Never edit the image via kubectl;
  # bump it here.
  tag: "v1"
  pullPolicy: IfNotPresent

# Ignored when hpa.enabled is true — the HPA owns replica count from then on
# and Helm stops setting spec.replicas so the two don't fight every sync.
replicaCount: 1

# Read by the app at startup (src/config.js) and printed by `/`. Defaults
# to the chart's release/name via the _helpers.tpl "microservice.name"
# template if unset.
serviceName: ""

# Extra env vars, e.g. [{name: LOG_LEVEL, value: info}]
env: []

# Sized to fit t3.small (2 vCPU / 2GiB, ~1.4GiB allocatable after kubelet
# reserves its share). At these requests, ~20 replicas fit a single node on
# memory alone — the real ceiling in this cluster is the platform stack.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Only the public-facing service (api-gateway) should set this true — every
# ALB Ingress is a real Application Load Balancer AWS bills for hourly.
ingress:
  enabled: false
  className: alb
  annotations: {}
  host: ""
  path: /
  pathType: Prefix
  tls: []
  # e.g.:
  # tls:
  #   - hosts: ["api.telemetry.internal"]
  #     secretName: api-gateway-tls

# Keep to 2-3 services cluster-wide; each active HPA is another thing
# fighting the other services for the same handful of free millicores.
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Pod-level: drop root entirely. Pairs with the telemetry-service image's
# (built in the sibling devsecops-pipeline repo) node:20-alpine base, which
# ships a built-in non-root `node` user at uid/gid 1000 (see that repo's
# Dockerfile runtime stage) — matched here rather than an arbitrary high
# UID so fsGroup-mounted volumes (the /tmp emptyDir below) are actually
# writable by the user the container runs as.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container-level: no privilege escalation, read-only rootfs (deployment.yaml
# mounts an emptyDir at /tmp so this doesn't break anything that needs to
# write scratch files), and every Linux capability dropped.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /readyz
    initialDelaySeconds: 3
    periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}

# Scraped by kube-prometheus-stack. Defaults to on for every service since
# a ServiceMonitor costs no extra pods/CPU — it's just a CRD the Prometheus
# Operator watches, so there's no reason to keep it opt-in like the heavier
# toggles above.
serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics
  additionalLabels: {}

# Off by default (see the resources note at the top of this file — a sidecar
# is ~60-90Mi extra per pod, which adds up fast across 12 services). Turn on
# per-service in charts/values/ to get a sidecar plus the VirtualService /
# DestinationRule below for retries, timeouts and outlier detection
# (circuit breaking) on the in-mesh (east-west) path. North-south ingress
# still goes through the ALB, not an Istio gateway, so this only affects
# service-to-service traffic.
#
# Requires the "apps" namespace to carry the istio-injection=enabled label
# (see argocd/manifests/namespaces) — the sidecar injector webhook only
# looks at labeled namespaces. When istio.enabled is false here, the pod
# gets an explicit sidecar.istio.io/inject: "false" annotation so it opts
# out of that namespace-wide injection instead of silently getting a
# sidecar anyway.
istio:
  enabled: false
  timeout: 10s
  retries:
    attempts: 3
    perTryTimeout: 2s
    retryOn: "5xx,reset,connect-failure"
