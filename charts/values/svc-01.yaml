# api-gateway — the platform's one public entry point. Deliberately the
# only service in this set of 10 with Ingress, HPA and an Istio sidecar all
# turned on, so it doubles as the demo of every feature the base chart
# supports; the other 9 stay minimal to keep the 2-node sandbox affordable.
nameOverride: api-gateway
serviceName: api-gateway

# Ignored once hpa.enabled is true below (see deployment.yaml) — left here
# just as documentation of the starting point before the HPA takes over.
replicaCount: 2

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # cert-manager watches this annotation and issues/renews the Secret
    # named below automatically. See argocd/manifests/cert-manager for why
    # this points at a self-signed issuer rather than Let's Encrypt.
    cert-manager.io/cluster-issuer: selfsigned-cluster-issuer
  host: api.eks-platform.example.com
  path: /
  pathType: Prefix
  tls:
    - hosts:
        - api.eks-platform.example.com
      secretName: api-gateway-tls

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

istio:
  enabled: true
